<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12314b"><title>Refresh Rx Mail Studio</title>
  <style>body{font:16px/1.6 Arial,sans-serif;color:#12314b;background:#f3f7fb;margin:0}main{max-width:480px;margin:12vh auto;padding:24px}h1{font-size:26px}button,a{display:inline-block;padding:12px 18px;border-radius:8px}button{background:#007568;color:white;border:0;font:inherit;cursor:pointer}button:disabled{opacity:.6}a{color:#007568}#status{min-height:3em}</style>
</head>
<body><main>
  <h1>Refresh Rx Mail Studio</h1>
  <p>This refreshes the app files on this device. Your saved workspace and sign-in details are kept.</p>
  <button id="refresh">Refresh and open app</button>
  <p id="status" role="status"></p>
  <a href="/">Open app</a>
</main><script>
document.getElementById('refresh').addEventListener('click',async function(){
  this.disabled=true;
  const status=document.getElementById('status');
  status.textContent='Refreshing app files…';
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      for(const registration of registrations){
        if(new URL(registration.scope).origin===location.origin&&new URL(registration.active?.scriptURL||registration.waiting?.scriptURL||registration.installing?.scriptURL||location.href).pathname==='/sw.js')await registration.unregister();
      }
    }
    if('caches' in window){
      const names=await caches.keys();
      await Promise.all(names.filter(name=>name.startsWith('rx-shell-')).map(name=>caches.delete(name)));
    }
    location.replace('/?refreshed='+Date.now());
  }catch(error){
    status.textContent='The refresh could not finish. Close the app and try opening it in Chrome.';
    this.disabled=false;
  }
});
</script></body></html>
